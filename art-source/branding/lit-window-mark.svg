<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Earn Your Skyline — the lit window (master, Nov 2026).
    Concept E from art-source/branding/concepts: a stepped art-deco tower set
    off-centre against a farther one, at dusk, with one lit window that is
    yours. Every icon in the game is generated from this file by
    `npm run build:art`. See docs/BRAND.md for why.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091326"/>
      <stop offset="0.58" stop-color="#1B2A49"/>
      <stop offset="0.86" stop-color="#3E3552"/>
      <stop offset="1" stop-color="#5A4256"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#F4B860" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F4B860" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#FFE2B0" stop-opacity="0.8"/>
      <stop offset="0.42" stop-color="#F4B860" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F4B860" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dusk -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#horizon)"/>

  <!-- the farther tower, a step lighter, a few windows dark for the night -->
  <rect x="332" y="226" width="134" height="286" fill="#111C30"/>
  <rect x="352" y="262" width="14" height="18" rx="2" fill="#1C2A44"/>
  <rect x="394" y="262" width="14" height="18" rx="2" fill="#1C2A44"/>
  <rect x="436" y="300" width="14" height="18" rx="2" fill="#1C2A44"/>
  <rect x="352" y="338" width="14" height="18" rx="2" fill="#1C2A44"/>

  <!-- your tower: mast, three setbacks, each with a ledge -->
  <rect x="217" y="26" width="10" height="70" rx="3" fill="#050A13"/>
  <rect x="172" y="88" width="100" height="124" fill="#050A13"/>
  <rect x="164" y="204" width="116" height="8" fill="#050A13"/>
  <rect x="146" y="210" width="152" height="104" fill="#050A13"/>
  <rect x="138" y="306" width="168" height="8" fill="#050A13"/>
  <rect x="108" y="312" width="228" height="200" fill="#050A13"/>

  <!-- the lit window -->
  <ellipse cx="222" cy="149" rx="112" ry="118" fill="url(#lamp)"/>
  <rect x="196" y="118" width="52" height="64" rx="4" fill="#F4B860"/>
  <rect x="220" y="118" width="4" height="64" fill="#D9963F"/>
  <rect x="196" y="146" width="52" height="4" fill="#D9963F"/>
</svg>
